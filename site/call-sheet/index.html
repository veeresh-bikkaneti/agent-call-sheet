<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Call Sheet — Mission Briefing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout">
  <!-- Rail -->
  <aside class="rail" aria-hidden="true">
    <div class="rail-track" role="img" aria-label="Timeline rail showing call progression">
      <div class="rail-fill"></div>
    </div>
  </aside>

  <!-- Header -->
  <header class="header">
    <span class="eyebrow">Mission Briefing</span>
    <h1>Agent Call Sheet</h1>
    <div class="meta-chips">
      <span class="chip">07:30–19:00</span>
      <span class="chip">10 Calls</span>
      <span class="chip">3 Holds</span>
      <span class="chip">Live Sync</span>
    </div>
  </header>

  <!-- Board -->
  <main class="board" role="main" aria-label="Call sheet cards"></main>
</div>

<script type="module" src="motion.js"></script>
</body>
</html>
