name: Deploy Agent Call Sheet to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "features/site/**"
      - "features/docs/**"
      - "features/live-debugger/board.html"
      - "features/visualization/visualization.html"
      - "features/eval/sample-run.jsonl"
      - "features/eval/real-run.jsonl"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (index.html + assets + visualization.html + live board + docs)
        run: |
          mkdir -p _site/board
          cp features/site/index.html _site/index.html
          cp -R features/site/assets _site/assets
          cp features/visualization/visualization.html _site/visualization.html
          cp features/live-debugger/board.html _site/board/index.html
          cp features/eval/sample-run.jsonl features/eval/real-run.jsonl _site/board/
          cp features/docs/BEGINNER-GUIDE.md features/docs/MANIFEST.md features/docs/live-debugger.md _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
