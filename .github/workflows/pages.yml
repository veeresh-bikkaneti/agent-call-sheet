name: Deploy demo + docs landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "episode/**"
      - "docs/**"
      - "front-door/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site (landing + the episode artifacts, copied untouched)
        run: |
          mkdir -p _site/episode
          mkdir -p _site/board
          mkdir -p _site/archive
          cp front-door/board.html _site/board/index.html
          cp front-door/sample-run.jsonl front-door/real-run.jsonl _site/board/
          cp site/index.html _site/index.html
          cp episode/ai-crew-the-fork.html _site/episode/
          cp episode/ai-crew-the-fork-trailer.mp4 _site/episode/
          cp archive/GAME-DOCS.html _site/archive/
          cp BEGINNER-GUIDE.md _site/
          cp visualization.html _site/
          cp docs/live-debugger.md _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
