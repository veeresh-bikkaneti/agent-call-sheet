name: Deploy Agent Call Sheet to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "features/site/index.html"
      - "features/site/assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the script integrity pins are current
        run: python3 features/site/tools/build_sri.py --check
      - name: Assemble the site (the game page and its assets only)
        run: |
          mkdir -p _site
          cp features/site/index.html _site/index.html
          cp -R features/site/assets _site/assets
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
