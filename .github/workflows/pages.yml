name: Deploy Agent Call Sheet to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "features/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the packs table has not drifted from the manifest
        run: python3 features/site/tools/build_packs.py --check
      - name: Static site checks (links, anchors, HTML sanity)
        run: python3 -I features/site/tools/check_site.py
      - name: Assemble the site (pages and assets only; no task notes, content or tools)
        run: |
          mkdir -p _site
          cp features/site/index.html _site/index.html
          cp -R features/site/install features/site/architecture features/site/packs features/site/faq features/site/walkthrough features/site/assets _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
