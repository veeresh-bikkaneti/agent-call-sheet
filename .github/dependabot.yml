# Dependabot configuration for The Agent Call Sheet.
#
# Everything under packs/ is a vendored third-party copy, documented in
# MANIFEST.md as copied byte-identical and covered by hash verification.
# AGENTS.md forbids editing included third-party copies in place, so
# Dependabot must not open update PRs against them — the six
# security-update PRs of 2026-10-26 (#1-#6) were closed for exactly this
# reason. open-pull-requests-limit: 0 disables Dependabot PRs (version
# and security) for the listed directories. A dependency change to a
# vendored copy happens only as a deliberate T1 source re-sync with
# license verification and a hash re-check (see AGENTS.md).
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/packs/design-video-3d/local-ui-ux-pro-max-skill/cli"
      - "/packs/design-video-3d/local-ui-ux-pro-max-skill/gallery"
      - "/packs/design-video-3d/local-ui-ux-pro-max-skill/stack"
      - "/packs/rigor/local-archify"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "pip"
    directories:
      - "/packs/design-video-3d/local-ui-ux-pro-max-skill/.claude/skills/ui-styling/scripts"
      - "/packs/design-video-3d/local-ui-ux-pro-max-skill/.claude/skills/ui-styling/scripts/tests"
      - "/packs/design-video-3d/local-ui-ux-pro-max-skill/cli/assets/skills/ui-styling/scripts"
      - "/packs/design-video-3d/local-ui-ux-pro-max-skill/cli/assets/skills/ui-styling/scripts/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
