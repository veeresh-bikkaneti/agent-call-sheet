  rationale: On 2026-10-24 the user had to correct the coordinator for not engaging the target repository AGENTS.md (message:f5a62c72-f618-47e8-8c09-54e4cb9dcc90). The coordinator admitted in assistant-msg-55c32f63-49ed-452c-8f07-f5d3c197f191 that the read-only audit and scan agents were never briefed on it and that only the perf agent reading it on its own initiative did not count as a brief. After the correction, the fix agent briefed on AGENTS.md end to end followed Tier 1 Solo TDD and the five gates and its work reached PR 240 (assistant-msg-5ac52bf6-81b0-39b1-d745-f147927b671c, assistant-msg-8d6b753a-7112-44af-9910-180bdd61344c). The orchestrator SKILL.md read first hand has no step reading a target repository own rules file or briefing it into dispatched agents, so this update adds only that step where the coordinator writes the brief, preserving all existing sections. It is distinct from the 2026-10-19 example and upload classification change, whose proxy covers examples promoted into production inputs and uploads routed to the wrong workstream.
